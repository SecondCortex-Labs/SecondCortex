[project]
name = "secondcortex"
version = "0.1.0"
description = "Local-first developer memory: snapshot store, HTTP API for the VS Code extension, MCP stdio server for coding agents."
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.5.5",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "mcp==1.26.0",
    "openai==2.28.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "uvicorn==0.42.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
secondcortex = "secondcortex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secondcortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
